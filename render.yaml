services:
  - type: web
    name: drivelegal-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements-deploy.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: APP_ENV
        value: production
      - key: SYNC_DATABASE_URL
        value: sqlite:///./drivelegal.db
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///./drivelegal.db
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: '["*"]'
      - key: GEMINI_API_KEY
        value: AIzaSyAHoRB9AJG8Oef8lbjnk4yPjJn8e5rJBKY
      - key: LLM_PROVIDER
        value: gemini
      - key: GOOGLE_CLIENT_ID
        value: 694541861987-7ep17jke8a3np236bgfrddf1nh5acf7t.apps.googleusercontent.com
