version: "3.9"

services:
  # ─── Backend API ──────────────────────────────────────────────
  api:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:password@db:5432/drivelegal
      - SYNC_DATABASE_URL=postgresql://postgres:password@db:5432/drivelegal
      - REDIS_URL=redis://redis:6379/0
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000
    env_file:
      - ./backend/.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./backend:/app
      - uploads:/app/uploads
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # ─── PostgreSQL ───────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: drivelegal
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ─── ChromaDB (Vector Store) ──────────────────────────────────
  chromadb:
    image: chromadb/chroma:latest
    ports:
      - "8001:8000"
    volumes:
      - chroma_data:/chroma/chroma

  # ─── Redis (Cache + Celery) ───────────────────────────────────
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # ─── Celery Worker (Background Tasks) ────────────────────────
  # worker:
  #   build: ./backend
  #   command: celery -A app.celery worker --loglevel=info
  #   env_file:
  #     - ./backend/.env
  #   depends_on:
  #     - redis
  #     - db

volumes:
  postgres_data:
  chroma_data:
  redis_data:
  uploads:
